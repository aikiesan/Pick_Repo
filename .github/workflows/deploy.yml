name: Deploy to GitHub Pages

# Builds and deploys the static reader to GitHub Pages on every push to main.
# There is no real build step (vanilla HTML/JS/CSS); the workflow just
# regenerates chapters_index.json as a safety net so the index is always fresh
# even if it was not regenerated locally, then publishes a clean copy of the
# static files.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate chapter index (safety net)
        run: python generate_index.py

      - name: Stage static site
        # Copy only what the site needs into _site, leaving out the scraper,
        # generator scripts, and .git history.
        run: |
          mkdir -p _site
          cp index.html styles.css app.js manifest.json sw.js chapters_index.json _site/
          cp -r chapters vendor fonts icons _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
